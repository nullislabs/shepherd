[package]
name = "price-alert"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example module: polls a Chainlink price oracle every block and emits a Warn log when the price crosses a config-supplied threshold."

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-sdk = { path = "../../../crates/nexum-sdk" }
alloy-primitives = { version = "1.6", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
nexum-sdk-test = { path = "../../../crates/nexum-sdk-test" }
# Only used by tests in `logic.rs` to encode a synthetic oracle
# return body; the production code uses `nexum_sdk::chain::chainlink`.
alloy-sol-types = { version = "1.6", default-features = false, features = ["std"] }
