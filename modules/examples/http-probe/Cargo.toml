[package]
name = "http-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example module: fetches an allowlisted URL over wasi:http on every block and verifies the off-list path is denied."

[lib]
crate-type = ["cdylib"]

[dependencies]
http.workspace = true
nexum-sdk = { path = "../../../crates/nexum-sdk" }
tracing = { version = "0.1", default-features = false }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
nexum-sdk-test = { path = "../../../crates/nexum-sdk-test" }
