[package]
name = "echo-venue"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-venue-sdk = { path = "../../../crates/nexum-venue-sdk" }
wit-bindgen = { version = "0.58", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
# The conformance kit: holds this adapter's header derivation to the kit's
# golden mirror types, so echo-venue is both the tutorial artefact and the
# kit's worked test target.
nexum-venue-test = { path = "../../../crates/nexum-venue-test" }
