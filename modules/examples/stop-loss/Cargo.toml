[package]
name = "stop-loss"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example module: stop-loss order submitter. Watches a Chainlink oracle, submits a CoW order intent through the pool when price drops below a configured trigger, dedups via the venue-and-body intent-id."

[lib]
crate-type = ["cdylib"]

[dependencies]
cow-venue = { path = "../../../crates/cow-venue", features = ["client"] }
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "17005ba50466e18a64b2f145544c75198549d8a1" }
videre-sdk = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "112868fb9dc3d9021a0fd17739d1443383b06612" }
cowprotocol = { version = "0.2.0", default-features = false }
alloy-primitives = { version = "1.6", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
# The chain-edge projections back the pinned-UID regression test.
cow-venue = { path = "../../../crates/cow-venue", features = ["client", "assembly"] }
nexum-sdk-test = { git = "https://github.com/nullislabs/nexum-runtime", rev = "17005ba50466e18a64b2f145544c75198549d8a1" }
# Only used by tests in `strategy.rs` to encode a synthetic oracle
# return body; the production code uses `nexum_sdk::chain::chainlink`.
alloy-sol-types = { version = "1.6", default-features = false, features = ["std"] }
