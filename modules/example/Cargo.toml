[package]
name = "example"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-sdk = { path = "../../crates/nexum-sdk" }
# The venue status-body codec the `on_custom` handler decodes an
# intent-status transition through, reached via `videre_sdk::status_body`.
videre-sdk = { path = "../../crates/videre-sdk" }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }
