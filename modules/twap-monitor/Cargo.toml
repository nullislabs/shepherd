[package]
name = "twap-monitor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
composable-cow = { path = "../../crates/composable-cow", features = ["run"] }
cow-venue = { path = "../../crates/cow-venue", features = ["client"] }
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "2ed882f21e685921cd27d1edec870e8adbb312aa" }
videre-sdk = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "fd8af027d9ae84823f8fcdcc6902b3af80cab451" }
alloy-primitives = { version = "1.6", default-features = false, features = ["std"] }
alloy-sol-types = { version = "1.6", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false }
wit-bindgen = { version = "0.59", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
# Test-only: the poll path receives orders inside `PollResult`, so the
# non-test build never names a cowprotocol type.
cowprotocol = { version = "0.2.0", default-features = false }
cow-venue = { path = "../../crates/cow-venue", features = ["client", "assembly"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Parses the shipped `component.toml` so the trigger parity test reads the
# real `event_signature` value rather than scanning the file text.
toml.workspace = true
nexum-sdk-test = { git = "https://github.com/nullislabs/nexum-runtime", rev = "2ed882f21e685921cd27d1edec870e8adbb312aa" }
