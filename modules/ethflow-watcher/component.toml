# ethflow-watcher: decode `CoWSwapEthFlow.OrderPlacement` logs, compute
# the orderbook UID, and put it under the host's status watch via the
# cow venue adapter. Observe-only: the module never submits.

[component]
name = "ethflow-watcher"
version = "0.1.0"
# No author `digest`: the runtime now verifies it against the loaded
# bytes, so a placeholder refuses the load. The operator pins the hash on
# the `[[modules]]` entry in engine.toml instead.

[dependencies]
# Least-privilege: `client` for the venue observe path, `logging` for
# structured runtime logs, `local-store` for the `observed:` journal.
# No `http`: all venue I/O rides the venue registry.
client = {}
logging = {}
local-store = {}

# CoWSwapEthFlow.OrderPlacement on Sepolia. topic-0 = keccak256(
# "OrderPlacement(address,(address,address,address,uint256,uint256,uint32,
#  bytes32,uint256,bytes32,bool,bytes32,bytes32),(uint8,bytes),bytes)"),
# pinned in shepherd/wit/shepherd-cow/cow-events.wit and parity-tested in
# keeper.rs.
# `address` is the Sepolia ETH_FLOW_PRODUCTION deployment from
# `cowprotocol/ethflowcontract/networks.prod.json`. Unlike
# ComposableCoW's CREATE2 address, EthFlow has had multiple per-network
# and per-version deployments; M5 multi-chain config MUST re-check the
# address per `chain_id` instead of assuming this value carries.
# `resume` for the same reason as twap-monitor's create stream: a
# placement seen once is the only thing that puts an order under watch,
# so a restart at head loses every order placed during the downtime.
# The `observed:{uid}` journal makes a replayed placement idempotent.
[[trigger]]
on = "event"
chain_id = 11155111
address = "0xbA3cB449bD2B4ADddBc894D8697F5170800EAdeC"
event_signature = "0xcf5f9de2984132265203b5c335b25727702ca77262ff622e136baa7362bf1da9"
resume = true
# This EthFlow deployment's creation block on Sepolia. Unlike
# ComposableCoW's single CREATE2 address, EthFlow has had several
# per-network and per-version deployments, so the block belongs to this
# `address` and must be re-derived whenever the address changes.
start_block = 7541028

# Status transitions the registry polls for watched receipts at the cow
# venue; the module journals `observed:{uid}` on the first one.
# `intent-status` is videre's own trigger kind, so boot validates it
# against the wired extensions.
[[trigger]]
on = "intent-status"
venue = "cow"
