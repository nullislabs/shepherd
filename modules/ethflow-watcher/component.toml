# ethflow-watcher: decode `CoWSwapEthFlow.OrderPlacement` logs, compute
# the orderbook UID, and put it under the host's status watch via the
# cow venue adapter. Observe-only: the module never submits.

[component]
name = "ethflow-watcher"
version = "0.1.0"
# No author `digest`: the runtime now verifies it against the loaded
# bytes, so a placeholder refuses the load. The operator pins the hash on
# the `[[modules]]` entry in engine.toml instead.

[dependencies]
# Least-privilege: `client` for the venue observe path, `logging` for
# structured runtime logs, `local-store` for the `observed:` journal.
# No `http`: all venue I/O rides the venue registry.
client = {}
logging = {}
local-store = {}

# CoWSwapEthFlow.OrderPlacement on Ethereum Mainnet. topic-0 = keccak256(
# "OrderPlacement(address,(address,address,address,uint256,uint256,uint32,
#  bytes32,uint256,bytes32,bool,bytes32,bytes32),(uint8,bytes),bytes)"),
# parity-tested against the sol! decoder in keeper.rs.
# `address` is the production EthFlow deployment, `ETH_FLOW_PRODUCTION`
# in the pinned cowprotocol crate. EthFlow has had several deployments
# per network and per version, so check the address again before you
# point this trigger at another chain.
# `resume` keeps a cursor, so a restart replays the placements it missed
# while it was down. The `observed:{uid}` journal makes a replayed
# placement idempotent.
# There is no `start_block`: the module only observes, so a first boot
# starts at the chain head and reads no history.
[[trigger]]
on = "event"
chain_id = 1
address = "0xbA3cB449bD2B4ADddBc894D8697F5170800EAdeC"
event_signature = "0xcf5f9de2984132265203b5c335b25727702ca77262ff622e136baa7362bf1da9"
resume = true

# Status transitions the registry polls for watched receipts at the cow
# venue; the module journals `observed:{uid}` on the first one.
# `intent-status` is videre's own trigger kind, so boot validates it
# against the wired extensions.
[[trigger]]
on = "intent-status"
venue = "cow"
