# M2 smoke / round-trip config for nexum.
#
# Boots the two M2 modules (ccow-monitor + ethflow-watcher) against
# Sepolia public RPC and the CoW Protocol Sepolia orderbook.
#
# Usage:
#   just run-m2
#   # or:
#   cargo build -p ccow-monitor    --target wasm32-wasip2 --release
#   cargo build -p ethflow-watcher --target wasm32-wasip2 --release
#   cargo run   -p nexum-cli -- --engine-config engine.m2.toml
#
# Override RPC if rate-limited:
#   SEPOLIA_RPC=wss://eth-sepolia.g.alchemy.com/v2/<KEY> ...
# Today the engine does not env-substitute - edit the URL inline.

[engine]
# Separate from `./data` so it does not collide with the M1 example
# runbook state. Wiped freely between smoke runs.
state_dir = "./data/m2"
log_level = "info,nexum_runtime=debug"
# Smoke config: the components are rebuilt for every run.
require_component_digest = false

# Sepolia. Public node; switch to Alchemy/Infura with a key for any
# sustained run (public nodes throttle aggressively under
# eth_subscribe load).
[chains.1]
rpc_url = "http://127.0.0.1:8545"

[[modules]]
id = "ccow-monitor"
path = "target/wasm32-wasip2/release/ccow_monitor.wasm"
manifest = "modules/ccow-monitor/component.toml"

[[modules]]
id = "ethflow-watcher"
path = "target/wasm32-wasip2/release/ethflow_watcher.wasm"
manifest = "modules/ethflow-watcher/component.toml"

# The cow venue ccow-monitor submits through, native Rust in the engine
# binary. Its orderbook must match the chain twap indexes.
[extensions.videre.venues.cow]
chain = 1
