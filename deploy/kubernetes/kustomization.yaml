# Base for one shepherd engine on Kubernetes. See docs/deployment/kubernetes.md.
#
# The base does not create the ConfigMap `shepherd-config` or the Secret
# `shepherd-rpc`: the guide shows how to make them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service.yaml
  - statefulset.yaml
