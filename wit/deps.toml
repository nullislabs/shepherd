# Cross-repo WIT dependencies, vendored into wit/deps/ by wit-deps.
#
# Each source is pinned to the owning repo's rev through the github
# archive tarball. The digests cover the raw tarball bytes. The revs
# match the nexum-* and videre-* pins in the crate manifests.
#
# A prefix that matches nothing vendors an empty tree and still exits 0,
# so only the diff against the checked-in wit/deps/ tree catches it.
#
# To re-vendor: set the new rev in the url and the prefix, record the new
# digests, run `wit-deps update`, and commit wit/ as one change.
#
# GitHub does not promise stable bytes for an auto-generated archive, so
# a digest mismatch can be its churn and not tampering.
[nexum-host]
url = "https://github.com/nxm-rs/nexum-runtime/archive/1010d8402b9c902388938834936dfe8a055cbe57.tar.gz"
sha256 = "be0cdebf70f9b0e75d8eeac0af621d2b45729bebbeb15d8b3f4e998d86c78ad4"
sha512 = "88f7815a58e78099a7e8660c396e206c3e7171f2ebd4e549b8e4b5a132a6fee322bb6b685fd04683e694f9f280349a8a93a8cc18f56383938cbd60ee8413330c"
prefix = "nexum-runtime-1010d8402b9c902388938834936dfe8a055cbe57/wit/nexum-host"

