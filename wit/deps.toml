# Cross-repo WIT dependencies, vendored into wit/deps/ by wit-deps.
# Sources point at the owning repo's pinned rev archive tarball. The
# sha256/sha512 digests are documented placeholders for now: wit/deps/
# is vendored and checked in, so builds resolve against the vendored
# copies; fill the digests in on the next `wit-deps update`. Each
# package lives under `wit/<package>` inside the owning repo's archive.
