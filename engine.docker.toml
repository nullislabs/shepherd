# Engine config for the container image. `docker-compose.yml` mounts it
# at `/etc/shepherd/engine.toml`.
#
# The paths below are the ones the `Dockerfile` bakes:
#
#   /opt/shepherd/modules/<name>.wasm        the compiled modules
#   /opt/shepherd/manifests/<name>.toml      their manifests
#   /var/lib/shepherd/                       the state directory (a volume)
#
# The RPC URL comes from the MAINNET_RPC_URL environment variable, which
# Compose forwards from `.env`. A variable that is not set stops the boot,
# and the error names it.
#
# See docs/deployment/docker.md.

[engine]
state_dir = "/var/lib/shepherd"
log_level = "info"
# The image builds the modules, so their digests are not known before the
# build. For a production run, pin each module and delete this line: see
# "Pin the module digests" in docs/deployment/docker.md.
require_component_digest = false

[engine.metrics]
enabled = true
# All interfaces inside the container. Compose publishes the port on the
# loopback address of the host only.
bind_addr = "0.0.0.0:9100"

# A ws:// or wss:// URL receives new blocks by subscription. An http:// or
# https:// URL polls.
[chains.1]
rpc_url = "${MAINNET_RPC_URL}"

[[modules]]
id = "ccow-monitor"
path = "/opt/shepherd/modules/ccow_monitor.wasm"
manifest = "/opt/shepherd/manifests/ccow-monitor.toml"

[[modules]]
id = "ethflow-watcher"
path = "/opt/shepherd/modules/ethflow_watcher.wasm"
manifest = "/opt/shepherd/manifests/ethflow-watcher.toml"

# The CoW venue is native code in the binary. `chain` selects its
# orderbook, and it must be the chain that the modules above read.
[extensions.videre.venues.cow]
chain = 1
