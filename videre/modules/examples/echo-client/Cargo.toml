[package]
name = "echo-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shepherd example module paired with the echo-venue adapter: submits an opaque body through videre:venue/client on every block and logs the intent-status transitions the registry fans back."

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nexum-sdk = { path = "../../../../nexum/crates/nexum-sdk" }
# The venue status-body codec the `on_custom` handler decodes an
# intent-status transition through, reached via `videre_sdk::status_body`.
videre-sdk = { path = "../../../crates/videre-sdk" }
wit-bindgen = { version = "0.58", default-features = false, features = ["macros", "realloc"] }
