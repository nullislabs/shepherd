[package]
name = "videre-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conformance kit for venue adapters: file-published borsh codec round-trip vectors, header-derivation golden fixtures, and an in-memory MockTransport for adapter unit tests."

[lib]
# Plain library, host-only - adapter crates list this under
# [dev-dependencies] so it never ships in the wasm bundle.

[lints]
workspace = true

[dependencies]
# The reference schema's payload structs derive the borsh traits, the
# same way a real venue's payload types do.
borsh.workspace = true
# Vector and golden files carry byte fields as lowercase hex so a
# non-Rust author can read them without a borsh decoder.
hex.workspace = true
# `MockFetch` speaks the standard `http` request/response types the
# SDK's `Fetch` seam is expressed in.
http.workspace = true
# Transport seam vocabulary: `ChainHost`, `Fault`, and the `Fetch` seam
# the mocks implement.
nexum-sdk = { path = "../../../nexum/crates/nexum-sdk" }
# `MockChain` is composed rather than reimplemented: one chain mock
# serves both personas.
nexum-sdk-test = { path = "../../../nexum/crates/nexum-sdk-test" }
# The contract under test: `IntentBody`, `BodyError`, the intent
# header types, and the `MessagingHost` seam.
videre-sdk = { path = "../videre-sdk" }
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
