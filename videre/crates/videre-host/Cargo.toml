[package]
name = "videre-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The videre venue platform as one nexum-runtime extension: the venue-adapter provider kind, the venue registry service, the advisory egress-guard seam, and the videre:venue/client interface."

[lints]
workspace = true

[dependencies]
# The runtime seam this crate plugs into; the only nexum crate edge.
nexum-runtime = { path = "../../../nexum/crates/nexum-runtime" }
# Encoder for the opaque status body the host event stream carries; the
# registry lowers an adapter-reported status through it.
nexum-status-body = { path = "../../../nexum/crates/nexum-status-body" }

wasmtime.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
nexum-runtime = { path = "../../../nexum/crates/nexum-runtime", features = ["test-utils"] }
nexum-tasks = { path = "../../../nexum/crates/nexum-tasks" }
tempfile.workspace = true
