[package]
name = "shepherd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "shepherd"
path = "src/main.rs"

[dependencies]
nexum-launch = { git = "https://github.com/nullislabs/nexum-runtime", rev = "2ed882f21e685921cd27d1edec870e8adbb312aa" }
nexum-runtime = { git = "https://github.com/nullislabs/nexum-runtime", rev = "2ed882f21e685921cd27d1edec870e8adbb312aa" }
videre-host = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "9ab15152b9279974cb42c3ee3aff054344f6050d" }

# The CoW venue, a native `videre_host::VenueInvoker` linked into this
# binary. It was a guest wasm component the operator wired by path until
# the runtime deleted the extension-installed component path.
cow-venue = { path = "../cow-venue", features = ["venue"] }

anyhow.workspace = true
# `[extensions.videre.venues.cow] owner`, the address the pre-sign submit
# path posts `from`.
alloy-primitives.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
# `[extensions.videre.venues.cow] orderbook-url`, the type `CowConfig`
# takes; the `url` crate carries no serde impl here, so the operator value
# parses from a string.
url.workspace = true

[dev-dependencies]
# The cow-on-the-seam integration tests (tests/platform_seam.rs) drive the
# generic runtime seam directly: `test-utils` turns on `MockTypes`,
# `mock_components` and `BootScenario`, at the same rev the crate already
# pins for the runtime.
nexum-runtime = { git = "https://github.com/nullislabs/nexum-runtime", rev = "2ed882f21e685921cd27d1edec870e8adbb312aa", features = ["test-utils"] }
# The versioned status-body codec the intent-status envelope carries; the
# tests build a `StatusBody` and encode it into an `IntentStatusUpdate`.
# Pinned to the same videre rev as `videre-host`.
videre-status-body = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "9ab15152b9279974cb42c3ee3aff054344f6050d" }
# The anvil-fork run reads the engine's own local store back once it has
# stopped, to prove a retired commitment left nothing behind. Same
# backend the runtime writes, so the read cannot drift from the write.
redb.workspace = true
