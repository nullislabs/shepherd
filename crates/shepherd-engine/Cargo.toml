[package]
name = "shepherd-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "shepherd"
path = "src/main.rs"

[dependencies]
nexum-launch = { git = "https://github.com/nullislabs/nexum-runtime", rev = "fd16db7709f01bf06116d98053a894de4b1f4adf" }
nexum-runtime = { git = "https://github.com/nullislabs/nexum-runtime", rev = "fd16db7709f01bf06116d98053a894de4b1f4adf" }
videre-host = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "66c8c3b6e8dfed9ae8865e906e6b7dd1d9b3ce46" }

# The CoW venue, a native `videre_host::VenueInvoker` linked into this
# binary. It was a guest wasm component the operator wired by path until
# the runtime deleted the extension-installed component path.
cow-venue = { path = "../cow-venue", features = ["venue"] }

anyhow.workspace = true
# `[extensions.videre.venues.cow] owner`, the address the pre-sign submit
# path posts `from`.
alloy-primitives.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
# `[extensions.videre.venues.cow] orderbook-url`, the type `CowConfig`
# takes; the `url` crate carries no serde impl here, so the operator value
# parses from a string.
url.workspace = true

[dev-dependencies]
# The cow-on-the-seam integration tests (tests/platform_seam.rs) drive the
# generic runtime seam directly: `test-utils` turns on `MockTypes`,
# `mock_components` and `BootScenario`, at the same rev the crate already
# pins for the runtime.
nexum-runtime = { git = "https://github.com/nullislabs/nexum-runtime", rev = "fd16db7709f01bf06116d98053a894de4b1f4adf", features = ["test-utils"] }
# The versioned status-body codec the intent-status envelope carries; the
# tests build a `StatusBody` and encode it into an `IntentStatusUpdate`.
# Pinned to the same videre rev as `videre-host`.
videre-status-body = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "66c8c3b6e8dfed9ae8865e906e6b7dd1d9b3ce46" }
