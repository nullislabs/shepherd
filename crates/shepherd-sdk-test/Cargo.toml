[package]
name = "shepherd-sdk-test"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-memory CoW host mock for Shepherd module unit tests. Implements shepherd_sdk::cow::CowApiHost and composes the nexum-sdk-test mocks."

[lib]
# Plain library, host-only - module Cargo.toml lists this under
# [dev-dependencies] so it never ships in the wasm bundle.

[dependencies]
nexum-sdk = { path = "../nexum-sdk" }
nexum-sdk-test = { path = "../nexum-sdk-test" }
shepherd-sdk = { path = "../shepherd-sdk" }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
# Order construction for the MockVenue acceptance tests that drive
# the keeper run end to end.
alloy-primitives.workspace = true
composable-cow = { path = "../composable-cow" }
cowprotocol = { version = "0.2.0", default-features = false }
