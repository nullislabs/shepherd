[package]
name = "shepherd-cow-host"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The host runtime this extension plugs into: HostState, the RuntimeTypes
# lattice, the extension seam, the capability namespace, and the shared
# `nexum:host/types` bindgen module the cow world binds through `with`.
nexum-runtime = { path = "../nexum-runtime" }

# `cow-api` backend. cowprotocol pulls `OrderBookApi`, `OrderCreation`,
# `OrderUid`, the orderbook base URL table per `Chain`, and the typed
# error surface the host re-projects into the cow-api-error variant.
cowprotocol.workspace = true
# REST passthrough for `cow_api::request`.
reqwest.workspace = true
# Typed HTTP method for the CoW passthrough.
http.workspace = true
# Typed EIP-155 chain ids for the orderbook pool keys.
alloy-chains.workspace = true
# `hex::encode_prefixed` for the returned OrderUid.
alloy-primitives.workspace = true

# WASM Component Model linker the extension hook writes into.
wasmtime.workspace = true

# `strum::IntoStaticStr` on the error enum for metric labels.
strum.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
metrics.workspace = true
serde_json = { workspace = true, features = ["std"] }
url.workspace = true
# `[extensions.cow]` config table: serde derive for `CowConfig`, toml
# for the opaque `toml::Value` handed over by the engine config.
serde.workspace = true
toml.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
tempfile.workspace = true
alloy-rpc-types-eth.workspace = true
