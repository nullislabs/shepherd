[package]
name = "videre-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Guest-side videre SDK: the VenueAdapter trait mirroring the venue-adapter world, the borsh-versioned IntentBody codec, the typed venue client over the native-AFIT transport seam, the generic keeper sweep assembler, and typed wrappers over the scoped transport imports."

[lib]
# Plain library - adapters link this and emit their own cdylib for the
# WASM Component. Building on the host target is also supported so the
# codec, client core, and conversions are unit-testable without a wasm
# toolchain (the wit-bindgen import shims compile to unreachable stubs
# off-wasm).

[lints]
workspace = true

[dependencies]
# Backs the `IntentBody` wire codec; re-exported (`body::__private`) for
# the derive's generated code so an adapter crate needs no direct borsh
# declaration unless its payloads derive the borsh traits themselves.
borsh.workspace = true
# Source of `#[venue]` and the `IntentBody` derive, re-exported at the
# crate root next to the trait they implement against.
videre-macros = { path = "../videre-macros" }
# Host-neutral SDK layer this crate builds on: the `ChainHost` seam the
# chain wrapper implements, the shared `Fault` vocabulary, and the
# wasi:http `fetch` surface re-exported as `transport::http`.
nexum-sdk = { path = "../nexum-sdk" }
# The standard request/response types the `Fetch` seam (and the
# `TimedFetch` middleware over it) is expressed in.
http.workspace = true
strum.workspace = true
thiserror.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
# In-memory `LocalStoreHost` behind the keeper sweep tests.
nexum-sdk-test = { path = "../nexum-sdk-test" }
