[package]
name = "nexum-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Guest-side SDK for nexum runtime modules: host-neutral helpers usable by any module, independent of the CoW domain layer."

[lib]
# Plain library - modules link this and emit their own cdylib for the
# WASM Component. Building on the host target is also supported so the
# helpers are unit-testable without a wasm toolchain.

[features]
# Standalone-debugging opt-in: also echo SDK tracing events to stderr.
# Off by default so the host logging interface stays the single source
# of SDK events; enabling it under the real host would duplicate every
# line through the host's own stdio capture.
stderr-echo = []

[dependencies]
# Re-exported as `nexum_sdk::module`; the proc-macro emits glue that
# calls back into this crate (`bind_host_via_wit_bindgen!`, the host
# trait seam, the tracing facade).
nexum-module-macros = { path = "../nexum-module-macros" }
# The single-source vocabularies: `ChainMethod` (re-exported as
# `chain::ChainMethod`) and the fault labels. Its world-synthesis half
# is unused here, so the guest links `toml` and never calls it.
nexum-world = { path = "../nexum-world" }
alloy-primitives.workspace = true
# Typed EIP-155 chain id; already in the guest graph via alloy-provider.
alloy-chains.workspace = true
# The `Log` type modules receive for chain-log events is alloy's own RPC log,
# assembled from the WIT record at the binding edge (see `events`).
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true
# The provider seam: `HostTransport` speaks alloy's JSON-RPC packet
# vocabulary over `ChainHost::request`, and `provider()` fronts it with
# a `RootProvider`. Featureless, so no ws/ipc/reqwest transport reaches
# the wasm guest.
alloy-json-rpc.workspace = true
alloy-provider.workspace = true
alloy-rpc-client.workspace = true
alloy-transport.workspace = true
tower.workspace = true
# Standard HTTP request/response/method vocabulary; the SDK adds only
# the wasi:http-specific `fetch` seam on top. wstd re-exports the same
# `http` types, so a request passes through to the client unconverted.
http.workspace = true
# `raw_value` backs the transport's pass-through of host JSON into
# alloy's `Box<RawValue>` payload slots.
serde_json = { workspace = true, features = ["std", "raw_value"] }
strum.workspace = true
thiserror.workspace = true
# `tracing-core` backs the guest facade's subscriber plumbing; the
# `tracing` macros are what the SDK's own code emits through it (e.g.
# the keeper gate-corruption warning).
tracing.workspace = true
tracing-core.workspace = true

[dev-dependencies]
proptest.workspace = true
# Dev-dependencies are excluded from Cargo's dependency-cycle check, so the
# nexum-sdk <- nexum-sdk-test dev-dep is a normal, supported arrangement: the
# keeper stores acceptance-test against the composed world-neutral MockHost.
# The keeper never touches the orderbook, so a CoW-layer mock would only drag
# the domain crates into this crate's dev graph.
nexum-sdk-test = { path = "../nexum-sdk-test" }

# The wasi:http client only links on the wasm guest target; host-side
# consumers (tests, native tooling) compile the `http` module's types
# without it.
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wstd.workspace = true
