[package]
name = "composable-cow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ComposableCoW keeper machinery: the conditional-order body, the fork's structured poll wire and its mapping onto Verdict, the residual revert classifier, and the run composition over the venue client."

[lib]
# Plain library, keeper-side only. The CoW venue crate is orderbook-only
# and never links this.

[lints]
workspace = true

[dependencies]
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
cowprotocol = { version = "0.2.0", default-features = false }
thiserror.workspace = true
nexum-sdk = { git = "https://github.com/nxm-rs/nexum-runtime", rev = "1010d8402b9c902388938834936dfe8a055cbe57" }
# `run` slice: the keeper run over the typed CoW client on the
# `videre:venue/client` seam.
cow-venue = { path = "../cow-venue", features = ["client", "assembly"], optional = true }
videre-sdk = { git = "https://github.com/nxm-rs/videre", rev = "0a187869a372369928427ccbfc543bc3bcf73afc", optional = true }
tracing = { workspace = true, optional = true }

[features]
# The poll-loop composition conditional-commitment keepers share:
# gate/journal discipline, pool submission, and retry dispatch.
run = ["dep:cow-venue", "dep:videre-sdk", "dep:tracing"]

[dev-dependencies]
proptest.workspace = true
nexum-sdk-test = { git = "https://github.com/nxm-rs/nexum-runtime", rev = "1010d8402b9c902388938834936dfe8a055cbe57" }

[[test]]
name = "run"
required-features = ["run"]
