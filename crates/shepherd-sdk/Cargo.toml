[package]
name = "shepherd-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CoW-domain guest SDK for Shepherd modules: cow-api host trait, order bridging, and prelude on top of cowprotocol types."

[lib]
# Plain library - modules link this and emit their own cdylib for the
# WASM Component. Building shepherd-sdk on the host target is also
# supported so the helpers are unit-testable without a wasm toolchain.

[dependencies]
# Re-export shim: the venue-neutral intent body types now live in the
# cow-venue default slice; this crate re-exports them under `cow` until
# the module ports move off the legacy path. The `client` slice carries
# the table-driven retry classification the cow error surface delegates
# to.
cow-venue = { path = "../cow-venue", features = ["client"] }
# The structured poll seam the keeper run dispatches on.
composable-cow = { path = "../composable-cow" }
nexum-sdk = { path = "../nexum-sdk" }
cowprotocol = { version = "0.2.0", default-features = false }
alloy-primitives.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `capture_tracing` observes the keeper run's diagnostics in the
# acceptance tests.
nexum-sdk-test = { path = "../nexum-sdk-test" }
alloy-sol-types.workspace = true
proptest.workspace = true
# Dev-only cycle (this crate <- shepherd-sdk-test): cargo permits it,
# and the keeper run acceptance-tests against the composed MockHost
# as an integration test - the mock crate links shepherd-sdk
# externally, so the unit-test copy of the traits would not unify.
shepherd-sdk-test = { path = "../shepherd-sdk-test" }
