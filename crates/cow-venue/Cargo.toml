[package]
name = "cow-venue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CoW venue slices, orderbook-only. The default `body` slice carries the venue-neutral order intent body types and their borsh IntentBody codec, linkable by adapters and modules."

[lib]
# The default `body` slice is dependency-light so a venue adapter
# component or a keeper module can link the intent body types and
# codec without the host-side CoW machinery. The cdylib is the
# `adapter` slice's component build (wasm32-wasip2).
crate-type = ["lib", "cdylib"]

[lints]
workspace = true

[dependencies]
# Payload structs derive the borsh traits directly, so the crate carries
# its own borsh declaration (the IntentBody derive reaches borsh through
# the venue SDK re-export, but the payload derives need it by name).
borsh = { workspace = true, optional = true }
# Source of the `IntentBody` derive and trait the version enum implements,
# and the typed intent client the `client` slice binds to the CoW venue.
videre-sdk = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "1da06af69a1a4ecc0bba095c91c338e3d841d4c7", optional = true }
# `client` slice only: the keeper `RetryAction` the generated
# classification table maps each errorType to. The TOML parse happens in
# `build.rs`, so serde/toml/thiserror are build- and dev-only and never
# reach a guest that links this slice.
nexum-sdk = { git = "https://github.com/nullislabs/nexum-runtime", rev = "fd16db7709f01bf06116d98053a894de4b1f4adf", optional = true }
# `assembly` slice: the chain-edge order projections and orderbook
# submission bodies. The `client` slice also enables it for the typed
# `OrderbookApiErrorType` classifier boundary. Express-declared (not
# workspace-inherited) so the guest build never inherits the native
# `http-client` feature.
cowprotocol = { version = "0.2.0", default-features = false, optional = true }
# `body` slice: the order body fields are alloy `Address`/`U256`, and
# `borsh` supplies their borsh impls (ruint for `U256`). Optional only
# so the empty `--no-default-features` build stays dependency-free.
alloy-primitives = { workspace = true, features = ["borsh"], optional = true }
alloy-sol-types = { workspace = true, optional = true }
# `adapter` slice: the orderbook REST speaker over the scoped
# wasi:http transport.
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
http = { workspace = true, optional = true }
url = { workspace = true, optional = true }
wit-bindgen = { workspace = true, optional = true }

# `build.rs` parses `data/classification.toml` and emits the static
# lookup table; the same parse is shared with the parity tests below.
[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# The conformance kit: holds the body codec to its published vector set.
videre-test = { git = "https://github.com/nullislabs/videre-nexum-module", rev = "1da06af69a1a4ecc0bba095c91c338e3d841d4c7" }
# Parity tests: the upstream `retry_hint()` the shipped table is
# reconciled against.
cowprotocol = { version = "0.2.0", default-features = false }

[features]
# The body-type + codec slice ships by default; the `client` slice layers
# the typed client and the table-driven retry classification on top.
# `--no-default-features` drops everything so downstream can depend on a
# single slice without pulling the codec or the keeper transitively.
default = ["body"]
body = ["dep:borsh", "dep:videre-sdk", "dep:alloy-primitives"]
client = ["body", "dep:nexum-sdk", "dep:cowprotocol"]
# Chain-edge order assembly, shared by the adapter's submit and the
# keeper's legacy submit path. Carries no component glue, so a keeper
# module can link it without exporting the adapter face.
assembly = ["body", "dep:cowprotocol", "dep:alloy-sol-types"]
# The venue-adapter component slice: the `#[videre_sdk::venue]` export
# and the orderbook transport. Only the cdylib wasm build enables it.
adapter = [
    "assembly",
    "client",
    "dep:serde",
    "dep:serde_json",
    "dep:http",
    "dep:url",
    "dep:wit-bindgen",
]

[[test]]
name = "conformance"
required-features = ["adapter"]
