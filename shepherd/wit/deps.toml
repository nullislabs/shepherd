# Cross-repo WIT pins, vendored under wit/deps and verified against
# deps.lock by `wit-deps`. Pins are exact git tags of the owning repo,
# one tag per upstream, agreeing with the Rust pins; they converge to
# wkg/OCI (ghcr.io/nullislabs) with per-package semver once the
# packages are published.

[nexum-host]
url = "https://github.com/nullislabs/nexum-runtime/archive/refs/tags/v0.1.0.tar.gz"
prefix = "nexum-runtime-0.1.0/wit/nexum-host"

[videre-types]
url = "https://github.com/nullislabs/videre-nexum-module/archive/refs/tags/v0.1.0.tar.gz"
prefix = "videre-nexum-module-0.1.0/wit/videre-types"

[videre-value-flow]
url = "https://github.com/nullislabs/videre-nexum-module/archive/refs/tags/v0.1.0.tar.gz"
prefix = "videre-nexum-module-0.1.0/wit/videre-value-flow"

[videre-venue]
url = "https://github.com/nullislabs/videre-nexum-module/archive/refs/tags/v0.1.0.tar.gz"
prefix = "videre-nexum-module-0.1.0/wit/videre-venue"
