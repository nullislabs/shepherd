# Engine-side runtime configuration for `nexum`.
#
# Distinct from `component.toml` (per-component manifest): this file
# describes the *engine*'s I/O wiring. Copy to `engine.toml` next to
# the binary, or pass the path as the third positional argument.
#
# ## Secrets workflow
#
# Paid RPC URLs (Alchemy / drpc / Infura / QuickNode keys) live in
# environment variables, not in this file. The engine substitutes
# `${VAR_NAME}` tokens at load time:
#
#   export MAINNET_RPC_URL=wss://eth-mainnet.g.alchemy.com/v2/<KEY>
#   export GNOSIS_RPC_URL=wss://gnosis-mainnet.g.alchemy.com/v2/<KEY>
#   export SEPOLIA_RPC_URL=wss://eth-sepolia.g.alchemy.com/v2/<KEY>
#   export ARBITRUM_RPC_URL=wss://arb-mainnet.g.alchemy.com/v2/<KEY>
#   export BASE_RPC_URL=wss://base-mainnet.g.alchemy.com/v2/<KEY>
#
# The Docker compose path picks these up from a gitignored `.env`
# file at the repo root - see `.env.example` and
# `docs/deployment/docker.md`.
#
# ## RPC scheme choice
#
# Both `wss://`/`ws://` and `https://`/`http://` work. A WebSocket URL
# pushes new blocks via `eth_subscribe(newHeads)`; an HTTP URL polls
# `eth_getBlockByNumber` at the chain's block time instead (logs already
# poll `eth_getLogs` on either transport). Prefer `wss://` where the
# provider exposes it - push is lower-latency and cheaper than polling.

[engine]
state_dir = "./data"
log_level = "info"
# Every [[modules]] entry must carry a `digest` pin, verified against the
# bytes handed to the compiler. Produce one with `shepherd digest <path>`.
# Set false only for a dev config where the artifact is rebuilt each run.
# require_component_digest = true

# Operator resource ceilings, applied per component. Every field is
# optional; omitted values resolve to built-in defaults (1B fuel per
# dispatch, 64 MiB memory). These were `[limits] fuel_per_event` and
# `[limits] memory_bytes`; naming either under [limits] now refuses at
# load.
[policy]
# max_fuel_per_dispatch = 1_000_000_000
# max_memory_bytes      = 67_108_864
# max_state_bytes       = 268_435_456

# Per-component narrowing of the ceilings above, keyed on the
# `[[modules]].id` the operator wrote. `http_allow` is the outbound
# wasi:http host allowlist for that component; it does not reach a venue,
# which is native code inside the binary.
# [policy.component.twap-monitor]
# http_allow = ["api.cow.fi"]

# Outbound wasi:http limits. The *_max_ms values are ceilings on the
# guest-settable request-options timeouts: values above a ceiling are
# clamped down, unset ones inherit it. total_deadline_ms bounds one
# whole exchange (connect through body streaming); a response body
# beyond response_body_max_bytes fails with HTTP-response-body-size.
# Millisecond values saturate into [1 ms, 24 h].
[limits.http]
# connect_timeout_max_ms       = 10_000
# first_byte_timeout_max_ms    = 30_000
# between_bytes_timeout_max_ms = 30_000
# total_deadline_ms            = 60_000
# response_body_max_bytes      = 16_777_216

# Chain JSON-RPC response size cap, applied host-side before a response
# is copied into guest memory. A single response - and the aggregate of
# one request-batch - beyond the cap fails with a typed invalid-input
# fault instead of inflating the module toward its max_memory_bytes limit.
# Modules that need more data per call should paginate (block-range
# chunking, request-batch). 0 saturates to 1. Default 1 MiB.
[limits.chain]
# response_body_max_bytes = 1_048_576

# Per-run log retention. bytes_per_run is the byte budget for one run's
# in-memory ring (oldest records evict first, the newest is never evicted
# to nothing); runs_retained is how many past runs are kept per module.
# Both saturate up to 1 if set to 0.
[limits.logs]
# bytes_per_run  = 262_144
# runs_retained  = 16

# Poison-pill quarantine thresholds. A module that reaches max_failures
# traps within a sliding window_secs is quarantined (the check fires at
# the threshold, not one past it): the supervisor stops dispatching to it
# until an engine restart clears the state. Both saturate up to 1 if set
# to 0.
[limits.poison]
# max_failures = 5
# window_secs  = 600

# One [chains.<id>] table per chain the engine should be able to talk
# to. Chain ids are EVM decimal. Drop any entry whose env var you
# haven't exported - `${VAR}` substitution fails fast with the exact
# missing variable named.
#
# Optional per-chain field:
#   request_timeout_secs = 30   # per-request JSON-RPC timeout (default: 30)

[chains.1]                                   # Ethereum Mainnet
rpc_url = "${MAINNET_RPC_URL}"

[chains.100]                                 # Gnosis Chain
rpc_url = "${GNOSIS_RPC_URL}"

[chains.11155111]                            # Sepolia
rpc_url = "${SEPOLIA_RPC_URL}"

[chains.42161]                               # Arbitrum One
rpc_url = "${ARBITRUM_RPC_URL}"

[chains.8453]                                # Base
rpc_url = "${BASE_RPC_URL}"

# ---- modules ----
#
# Each entry resolves a (component.wasm, component.toml) pair. `id` is
# operator-written and mandatory: it is the join column for
# `[policy.component.<id>]`, and the author's `[component].name` never
# binds policy. `digest` is mandatory unless `[engine]
# require_component_digest` is false; get one from
# `shepherd digest <path>`.

# [[modules]]
# id = "twap-monitor"
# path = "target/wasm32-wasip2/release/twap_monitor.wasm"
# manifest = "modules/twap-monitor/component.toml"
# digest = "sha256:<64 hex chars>"

# ---- venues ----
#
# A venue is native Rust compiled into the engine binary, reached through
# the videre venue registry. `[[adapters]]` is gone: the runtime deleted
# the extension-installed component path, so a venue is no longer a wasm
# artifact the operator wires by `path` and `manifest`, and no longer
# carries an `http_allow` grant - the wasi:http gate covers guest
# components only, and a venue reaches the network through the host stack.
# Swapping a venue now means a new binary.
#
# What survives is the settings the adapter manifest's `[config]` table
# carried, keyed under the venue id. An id this binary does not link
# refuses at load.
#
#   chain          required, decimal chain id or orderbook slug
#   orderbook_url  optional, overrides that chain's public orderbook
#   owner          optional, hex address enabling the pre-sign path
#   timeout_ms     optional, per-request bound on an orderbook call
#
# Wire the chain the submitting modules index. Leaving this out is not an
# error, but any module declaring `[venue] body_version` then refuses to
# boot, because no registered venue decodes its bodies.

# [extensions.videre.venues.cow]
# chain = 1
