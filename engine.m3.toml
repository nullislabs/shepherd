# M3 smoke / validation config for nexum.
#
# Boots the 2 M3 example modules (price-alert + balance-tracker)
# against Sepolia. The modules exercise the full SDK helper surface
# (chain::request via Chainlink read, local-store diffing, pool submit
# through the cow adapter with PreSign).
#
# Usage:
#   just run-m3
#   # or:
#   cargo build -p price-alert     --target wasm32-wasip2 --release
#   cargo build -p balance-tracker --target wasm32-wasip2 --release
#   cargo build -p cow-venue --features adapter --target wasm32-wasip2 --release
#   cargo run   -p shepherd-engine -- --engine-config engine.m3.toml

[engine]
# Separate from data/m2 and the M1 example state.
state_dir = "./data/m3"
log_level = "info,nexum_runtime=debug"

# Sepolia. Override with an Alchemy / Infura WS for sustained runs;
# the public node throttles eth_subscribe under load.
[chains.11155111]
rpc_url = "wss://ethereum-sepolia-rpc.publicnode.com"

[[modules]]
path = "target/wasm32-wasip2/release/price_alert.wasm"
manifest = "../nexum-runtime/modules/examples/price-alert/module.toml"

[[modules]]
path = "target/wasm32-wasip2/release/balance_tracker.wasm"
manifest = "../nexum-runtime/modules/examples/balance-tracker/module.toml"

# --- adapters ---------------------------------------------------------

# The cow venue adapter the modules submit through (`just
# build-cow-venue`). Sepolia manifest: the adapter's orderbook must
# match the chain the oracle is read on.
[[adapters]]
path = "target/wasm32-wasip2/release/cow_venue.wasm"
manifest = "crates/cow-venue/module.sepolia.toml"
http_allow = ["api.cow.fi"]
