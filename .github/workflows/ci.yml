name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-03-27
        with:
          toolchain: "1.94"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-03-27
        with:
          toolchain: "1.94"
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Make mold the default linker. This is the one job that links native
      # binaries (the test harnesses), so it is where a faster linker pays off;
      # setup-mold symlinks it as `ld`, so no RUSTFLAGS and no cache-key churn.
      # wasm targets link with rust-lld, untouched.
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-03-27
        with:
          toolchain: "1.94"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest
      - name: build module wasms for the integration tests
        run: >
          cargo build --release --target wasm32-wasip2 --locked
          -p example -p twap-monitor -p ethflow-watcher -p price-alert
          -p balance-tracker -p stop-loss -p http-probe
          -p clock-reader -p flaky-bomb -p fuel-bomb -p memory-bomb -p panic-bomb
      - run: cargo nextest run --workspace --all-features --no-fail-fast --locked
      # nextest does not run doctests; keep them covered separately.
      - run: cargo test --doc --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-03-27
        with:
          toolchain: "1.94"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo doc --workspace --no-deps --locked

  build-module:
    name: build ${{ matrix.module }} (wasm32-wasip2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - example
          - twap-monitor
          - ethflow-watcher
          - price-alert
          - balance-tracker
          - stop-loss
          - http-probe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-03-27
        with:
          toolchain: "1.94"
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo build -p ${{ matrix.module }} --target wasm32-wasip2 --release --locked
      - name: report wasm size
        run: |
          artifact_name=$(echo "${{ matrix.module }}" | tr '-' '_')
          wasm_path="target/wasm32-wasip2/release/${artifact_name}.wasm"
          if [ -f "$wasm_path" ]; then
            size=$(wc -c < "$wasm_path")
            echo "${{ matrix.module }} .wasm size: ${size} bytes"
          fi
