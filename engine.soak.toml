# 7-day grant soak config for nexum.
#
# This config is purpose-built for the unattended 7-day stability run
# required as evidence for the grant milestones:
#
#   M1 (24h): snapshots from hour 0-24
#   M2 (48h): snapshots from hour 0-48
#   M4 (7-day): full soak run
#
# Hard gate: clean run by Jul 21.
#
# Boots all 5 production + example modules on Sepolia:
#
#   - twap-monitor       (modules/twap-monitor)
#   - ethflow-watcher    (modules/ethflow-watcher)
#   - price-alert        (modules/examples/price-alert)
#   - balance-tracker    (modules/examples/balance-tracker)
#   - stop-loss          (modules/examples/stop-loss)
#
# Key differences from engine.e2e.toml:
#   - state_dir = ./data/soak  (separate from e2e, never wiped on restart)
#   - log_level = info         (no nexum_runtime=debug — 7 days of debug
#                               output would generate tens of GB of logs)
#
# Operator runbook: docs/operations/soak-runbook.md
# Usage:  scripts/soak-run.sh

[engine]
# Separate from data/e2e so the soak state is never wiped by an
# accidental e2e re-run. The soak run expects this dir to persist
# across restarts if the operator needs to resume.
state_dir = "./data/soak"

# info only — debug-level logging across a 7-day run produces
# unmanageable log volume. Flip back to info,nexum_runtime=debug
# only when actively debugging a specific incident.
log_level = "info"

# Bind /metrics so the hourly snapshot loop (scripts/soak-run.sh)
# can scrape Prometheus every 3600 s. 127.0.0.1 is intentional —
# do not expose a metrics port on a public interface.
[engine.metrics]
enabled = true
bind_addr = "127.0.0.1:9100"

# Sepolia. Override with an Alchemy / Infura WS for the run; the
# public node throttles `eth_subscribe` under sustained load (>1
# `eth_call` per module per block = 4 calls/12 s window minimum,
# more under bursts of EthFlow / TWAP activity).
[chains.11155111]
rpc_url = "wss://ethereum-sepolia-rpc.publicnode.com"

# --- modules ----------------------------------------------------------

[[modules]]
path = "target/wasm32-wasip2/release/twap_monitor.wasm"
manifest = "modules/twap-monitor/module.toml"

[[modules]]
path = "target/wasm32-wasip2/release/ethflow_watcher.wasm"
manifest = "modules/ethflow-watcher/module.toml"

[[modules]]
path = "target/wasm32-wasip2/release/price_alert.wasm"
manifest = "modules/examples/price-alert/module.toml"

[[modules]]
path = "target/wasm32-wasip2/release/balance_tracker.wasm"
manifest = "modules/examples/balance-tracker/module.toml"

[[modules]]
path = "target/wasm32-wasip2/release/stop_loss.wasm"
manifest = "modules/examples/stop-loss/module.toml"
